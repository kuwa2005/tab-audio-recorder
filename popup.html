<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Tab Audio Recorder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Tab Audio Recorder</h1>
      <div class="status" id="status">準備完了</div>
    </header>

    <div class="controls">
      <button id="recordBtn" class="btn btn-primary">録音開始</button>
    </div>

    <div class="info">
      <p>タブで流れている音声を録音します。</p>
      <p>複数タブで同時録音可能です。</p>
      <p>録音停止時にWebMファイルがダウンロードされます。</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
